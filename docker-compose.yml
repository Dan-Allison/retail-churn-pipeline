services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: retail-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  workspace:
    image: python:3.11-slim-bookworm
    container_name: retail-workspace
    depends_on:
      - sqlserver
    volumes:
      - ./:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash -c "apt-get update && apt-get install -y curl gnupg2 && curl -s https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg && echo 'deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main' > /etc/apt/sources.list.d/mssql-release.list && apt-get update && ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev && pip install pyodbc pandas openpyxl sqlalchemy && bash"

volumes:
  sql-data: